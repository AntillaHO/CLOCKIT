name: Sleep Compressor APK
on:
  push:
    branches: [sleep-compressor-v2]
    paths-ignore:
      - 'SleepCompressor-v2.apk'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SleepCompressor-v2.apk
          test -s SleepCompressor-v2.apk
          unzip -t SleepCompressor-v2.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify SleepCompressor-v2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SleepCompressor-v2-APK
          path: SleepCompressor-v2.apk
      - name: Publish test APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SleepCompressor-v2.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Build Sleep Compressor v2 APK [skip ci]'
            git push origin HEAD:sleep-compressor-v2
          fi
