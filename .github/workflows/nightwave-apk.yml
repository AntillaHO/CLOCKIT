name: NIGHTWAVE APK

on:
  push:
    branches: [nightwave-apk]
    paths-ignore:
      - 'nightwave.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Install Android 35
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build NIGHTWAVE
        run: gradle -p nightwave :app:assembleDebug --no-daemon --stacktrace
      - name: Validate and stage APK
        run: |
          cp nightwave/app/build/outputs/apk/debug/app-debug.apk nightwave.apk
          unzip -t nightwave.apk >/dev/null
          test -s nightwave.apk
          ls -lh nightwave.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NIGHTWAVE-Android-APK
          path: nightwave.apk
      - name: Publish direct APK download to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nightwave.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Build NIGHTWAVE APK [skip ci]'
            git push origin HEAD:nightwave-apk
          fi
